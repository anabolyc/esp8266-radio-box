# ============================================================
# Sendspin remote on a LOLIN S3 mini
# (ESP32-S3FH4R2: 4 MB flash, 2 MB PSRAM)
# ============================================================
# Drop-in replacement for the LOLIN S2 mini (sendspin-remote-01.yaml).
# Same footprint, different GPIO numbers behind the same header pins.
# PSRAM allows full-size cover art and the default network settings.
# ============================================================

substitutions:
  # Where the packages come from (see packages: below)
  packages_url: https://github.com/anabolyc/esp8266-radio-box
  packages_ref: master

  name: sendspin-remote-02
  friendly_name: Remote 02

  # Home Assistant player the middle button resumes after playback was stopped
  sendspin_resume_entity: media_player.living_room

  # Pins, by header position on the S2 mini footprint
  side_button: GPIO0         # on-board "0" button
  left_button: GPIO10        # S2 mini: GPIO12
  middle_button: GPIO16      # S2 mini: GPIO16
  right_button: GPIO13       # S2 mini: GPIO9
  spi_clk_pin: GPIO12        # S2 mini: GPIO7
  spi_mosi_pin: GPIO11       # S2 mini: GPIO11
  display_dc_pin: GPIO18     # S2 mini: GPIO18
  display_reset_pin: GPIO4   # S2 mini: GPIO5; also the backlight

  # Memory-dependent settings (see the packages for the low-memory defaults)
  task_stack_in_psram: true
  cover_art_size: 240
  lvgl_buffer_size: 25%

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Remote packages resolve their own includes (.h files) from 2026.9.0
  min_version: 2026.9.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:
  level: DEBUG

api:

ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Skip the scan: connect to the access point used last time
  fast_connect: true

packages:
  # Pulled from GitHub, so this file is all ESPHome needs. To build local edits
  # to the packages instead, point packages_url / packages_ref at your fork or
  # branch, or replace this with !include packages/<file> lines.
  remote:
    url: ${packages_url}
    ref: ${packages_ref}
    path: firmware/esphome/packages
    refresh: 1d
    # In this order: later packages extend earlier ones
    files:
      - gpio.yaml
      - sendspin-screen-only.yaml
      - display-tft.yaml
      - sendspin-addon-display.yaml
      - sendspin-addon-buttons.yaml
      # After the buttons package: browse.yaml's middle button handler must run after it
      - browse.yaml
      # Lists on the browse page, in side button order
      - somafm-stations.yaml
      - ambient-scenes.yaml
      # Screens after the lists, in side button order
      - lights.yaml
      - sleep.yaml
