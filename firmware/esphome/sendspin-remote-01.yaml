# ============================================================
# Sendspin remote on a LOLIN S2 mini
# (ESP32-S2FH4: 4 MB flash, no PSRAM)
# ============================================================
# Pins use the package defaults (packages/gpio.yaml, display-tft.yaml).
# Without PSRAM, memory is tight: see the network and sdkconfig settings
# below and the low-memory defaults in the packages.
# ============================================================

substitutions:
  task_stack_in_psram: false

  name: sendspin-remote-01
  friendly_name: Remote 01

  # Home Assistant player the middle button resumes after playback was stopped
  sendspin_resume_entity: media_player.living_room

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s2
  framework:
    type: esp-idf
    sdkconfig_options:
      # The wifi component applies sendspin's high-performance buffers even with
      # network.enable_high_performance: false, so restore the IDF defaults here
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "10"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_RX_BA_WIN: "6"

logger:
  level: DEBUG

api:

ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Skip the scan: connect to the access point used last time
  fast_connect: true

# No PSRAM on this board and no audio playback: the 64KB TCP windows and extra
# WiFi buffers that sendspin requests leave no heap for artwork and LVGL.
network:
  enable_high_performance: false

packages:
  gpio: !include packages/gpio.yaml
  sendspin-screen-only: !include packages/sendspin-screen-only.yaml
  display-tft: !include packages/display-tft.yaml
  sendspin-addon-display: !include packages/sendspin-addon-display.yaml
  sendspin-addon-buttons: !include packages/sendspin-addon-buttons.yaml
  # After the buttons package: browse.yaml's middle button handler must run after it
  browse: !include packages/browse.yaml
  # Lists on the browse page, in side button order
  somafm-stations: !include packages/somafm-stations.yaml
  ambient-scenes: !include packages/ambient-scenes.yaml
  # Screens after the lists, in side button order
  lights: !include packages/lights.yaml
  sleep: !include packages/sleep.yaml

# TEMP: heap diagnostics
interval:
  - interval: 5s
    then:
      - lambda: |-
          ESP_LOGI("heap", "free %u, largest block %u, min free %u",
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_8BIT),
                   (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_8BIT),
                   (unsigned) heap_caps_get_minimum_free_size(MALLOC_CAP_8BIT));

# TEMP: trigger the button scripts over the API for debugging
button:
  - platform: template
    name: "TEMP Middle Button"
    on_press:
      - script.execute: sendspin_toggle_playback
  - platform: template
    name: "TEMP Play Selected Station"
    on_press:
      - script.execute: browse_select
